[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalbridge"
version = "0.1.0"
description = "The missing bridge between notebook eval and production A/B testing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "jinja2"]

[project.optional-dependencies]
mlflow = ["mlflow>=2.0"]
wandb  = ["wandb>=0.15"]
hf     = ["huggingface-hub>=0.20"]
dev    = ["pytest", "pytest-cov", "black", "ruff", "scikit-learn"]

[project.scripts]
evalbridge = "evalbridge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["evalbridge*"]

[tool.setuptools.package-data]
evalbridge = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py39"]
